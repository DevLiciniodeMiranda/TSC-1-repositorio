<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>NextLevel - Recuperar Senha</title>
</head>
<body>
    <header>
        <h1>NextLevel</h1>
        <p>Recupere o acesso ao seu personagem.</p>
    </header>

    <main>
        <section>
            <h2>Redefinir Senha</h2>
            <form action="index.html" method="GET">
                <div>
                    <label for="nome-usuario">Nome de Usuário (Apelido):</label>
                    <input type="text" id="nome-usuario" name="nome-usuario" required>
                </div>
                <br>
                <div>
                    <label for="nova-senha">Nova Senha:</label>
                    <input type="password" id="nova-senha" name="nova-senha" required>
                </div>
                <br>
                <div>
                    <label for="confirma-nova-senha">Confirmar Nova Senha:</label>
                    <input type="password" id="confirma-nova-senha" name="confirma-nova-senha" required>
                </div>
                <br>
                <button type="submit">Redefinir Senha e Voltar ao Login</button>
            </form>
            
            <p>Lembrou a senha? <a href="index.html">Voltar para o login</a>.</p>
        </section>
    </main>
</body>
</html>
