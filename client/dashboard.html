<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>NextLevel - Meu Painel</title>
</head>
<body>
    <header>
        <h2>NextLevel</h2>
        <nav>
            <ul>
                <li><a href="dashboard.html">Meu Painel</a></li>
                <li><a href="habitos.html">Gerenciar Hábitos</a></li>
                <li><a href="index.html">Sair</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="status-perfil">
            <h3>Seu Perfil</h3>
            <p><strong>Nível:</strong> 1</p>
            <p><strong>Ofensiva:</strong> 0 dias consecutivos 🧊</p>
            <label for="xp-bar">Progresso de XP (0/100):</label>
            <progress id="xp-bar" value="0" max="100">0%</progress>
        </section>

        <section id="habitos-hoje">
            <h3>Missões de Hoje</h3>
            
            <article>
                <p>O seu diário de missões está vazio. É hora de forjar o seu primeiro hábito!</p>
                <br>
                <form action="habitos.html" method="GET">
                    <button type="submit">Criar Primeira Missão</button>
                </form>
            </article>
        </section>
    </main>

    <footer>
        <p>Continue focado para não perder sua ofensiva!</p>
    </footer>
</body>
</html>
