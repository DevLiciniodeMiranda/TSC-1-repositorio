<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>NextLevel - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>NextLevel</h1>
        <p>O RPG da sua evolução pessoal.</p>
    </header>

    <main>
        <section>
            <h2>Acesse sua conta</h2>
            <form action="dashboard.html" method="GET">
                <div>
                    <label for="email">E-mail de acesso:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <br>
                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </div>
                <br>
         <!-- ... botão de entrar ... -->
            <button type="submit">Entrar no Jogo</button>
        </form>

        <p>Ainda não tem um personagem? <a href="cadastro.html">Crie sua conta agora</a>.</p>
    </section>
</main>

    <footer>
        <p>&copy; 2026 NextLevel - Projeto Acadêmico</p>
    </footer>
</body>
</html>
