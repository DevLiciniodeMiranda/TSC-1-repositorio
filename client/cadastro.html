<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>NextLevel - Criar Personagem</title>
</head>
<body>
    <header>
        <h1>NextLevel</h1>
        <p>Inicie sua jornada de evolução.</p>
    </header>

    <main>
        <section>
            <h2>Forjar Novo Personagem</h2>
            <form action="dashboard.html" method="GET">
                <div>
                    <label for="nome">Nome do Jogador:</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu apelido" required>
                </div>
                <br>
                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <br>
                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </div>
                <br>
                <div>
                    <label for="confirma-senha">Confirmar Senha:</label>
                    <input type="password" id="confirma-senha" name="confirma-senha" required>
                </div>
                <br>
                <button type="submit">Criar Conta e Jogar</button>
            </form>
            
            <p>Já possui um personagem? <a href="index.html">Acesse o jogo aqui</a>.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 NextLevel - Projeto Acadêmico</p>
    </footer>
</body>
</html>
